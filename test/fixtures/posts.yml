# "ruby" appears in ruby_post's tags *and* its categories, which is what the
# cloud tests lean on to prove taggings are summed across columns.
# php_post is the only post sharing no tag with the other two.

ruby_post:
  user: david
  tags: [ ruby, elixir, crystal ]
  categories: [ ruby, programming ]

rails_post:
  user: david
  tags: [ ruby, rails, react ]
  categories: [ programming, backend ]

# categories deliberately left unset: a NULL array column is what a plain
# create produces when a model does not tag every column, and it is the case
# that silently vanished from exclude queries before the COALESCE fix.
php_post:
  user: david
  tags: [ php, yii2, angular ]
