inherit_gem:
  rubocop-rails-omakase: rubocop.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - 'bin/*'
    - 'tmp/**/*'
    - 'docs/**/*'
    - 'Gemfile'
    - 'vendor/**/*'
    - 'gemfiles/**/*'
    # Generated by running the dummy app's migrations
    - 'test/dummy/db/schema.rb'
  DisplayCopNames: true
  TargetRubyVersion: 3.2
