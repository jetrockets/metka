<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="96" height="96">
  <style>
    .ink { fill: #24292f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
    }
  </style>
  <!-- pixel mark: [ tag tag ] on a 15px grid -->
  <g transform="translate(15 15)" shape-rendering="crispEdges">
    <!-- left bracket -->
    <g class="ink">
      <rect x="0" y="15" width="30" height="240"/>
      <rect x="30" y="15" width="30" height="30"/>
      <rect x="30" y="225" width="30" height="30"/>
    </g>
    <!-- right bracket -->
    <g class="ink">
      <rect x="240" y="15" width="30" height="240"/>
      <rect x="210" y="15" width="30" height="30"/>
      <rect x="210" y="225" width="30" height="30"/>
    </g>
    <!-- back tag -->
    <g transform="translate(15 -60)">
      <path fill="#fb7185" fill-rule="evenodd" d="M90 120 H195 V135 H210 V195 H195 V210 H90 V195 H75 V180 H60 V150 H75 V135 H90 Z M90 150 h30 v30 h-30 z"/>
    </g>
    <!-- front tag -->
    <path fill="#e11d48" fill-rule="evenodd" d="M90 120 H195 V135 H210 V195 H195 V210 H90 V195 H75 V180 H60 V150 H75 V135 H90 Z M90 150 h30 v30 h-30 z"/>
  </g>
</svg>
